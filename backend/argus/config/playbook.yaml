# The only actions a brief may recommend. The LLM picks one id; it cannot invent actions.
actions:
  dispatch_guard:   "Dispatch the nearest guard to the area"
  review_footage:   "Review the linked camera footage before acting"
  secure_object:    "Cordon off and inspect the unattended object"
  track_subject:    "Follow the subject across adjacent cameras"
  crowd_control:    "Send staff to manage the crowd and keep exits clear"
  notify_police:    "Escalate to local police with the evidence pack"
  monitor:          "Keep monitoring; no action yet"
  armed_response:   "Alert armed response and police now; keep people away from the subject"
  intervene:        "Send guards together to separate the people and call medical help"
  medical:          "Send first aid to the person on the ground"
  observe_exchange: "Watch the spot on camera and send a guard to observe discreetly"
  check_camera:     "Send a guard to the camera and to what it was watching; review its last frames"

# Default action per signal type (used by the template brief and as a hint to the LLM)
defaults:
  abandoned_object:    secure_object
  custody_change:      track_subject
  vehicle_in_ped_zone: dispatch_guard
  loitering:           review_footage
  running:             review_footage
  device_exodus:       review_footage
  device_crowding:     crowd_control
  device_dispersal:    review_footage
  door_surge:          review_footage
  occupancy_anomaly:   review_footage
  weapon_visible:      armed_response
  violence:            intervene
  person_down:         medical
  hand_off:            monitor
  dealing_pattern:     observe_exchange
  camera_obstructed:   check_camera
  camera_restored:     review_footage
  default:             monitor

# Evidence that tells a known story gets that story as the incident's title (all listed types present).
stories:
  - types: [weapon_visible, violence]
    title: "Armed assault in progress"
    action: armed_response
  - types: [violence, person_down]
    title: "Assault: person on the ground"
    action: intervene
  - types: [weapon_visible, person_down]
    title: "Weapon seen and person on the ground"
    action: armed_response
  - types: [abandoned_object, custody_change]
    title: "Possible theft: unattended object taken"
    action: track_subject

# Signals that always warrant a human, whatever else agrees: an incident holding one opens at once.
# abandoned_object reaches 0.8 only when its owner has walked out of view (0.7 while they are merely away).
decisive:
  abandoned_object: {min_severity: 0.8, min_confidence: 0.6}
  weapon_visible:   {min_severity: 0.5, min_confidence: 0.5}
  violence:         {min_severity: 0.6, min_confidence: 0.5}
  camera_obstructed: {min_severity: 0.6, min_confidence: 0.5}

# Human-readable names for signal types
titles:
  abandoned_object:    "Unattended object"
  custody_change:      "Object changed hands"
  vehicle_in_ped_zone: "Vehicle in pedestrian area"
  loitering:           "Loitering"
  running:             "Person running"
  device_exodus:       "Many people leaving at once"
  device_crowding:     "Unusual crowding"
  device_dispersal:    "Area emptied suddenly"
  door_surge:          "Unusual door traffic"
  occupancy_anomaly:   "Unusual occupancy"
  weapon_visible:      "Weapon seen"
  violence:            "Fight or violent struggle"
  person_down:         "Person on the ground"
  hand_off:            "Hand-to-hand exchange"
  dealing_pattern:     "Repeated hand-offs (possible dealing)"
  camera_obstructed:   "Camera view lost"
  camera_restored:     "Camera view restored"

# ---- Forecast and response planning (argus/forecast.py) ---------------------------------------------------------
# Crime scripts (situational crime prevention: precursor -> commission -> departure). Each stage lists the signal
# types that show it and the action that disrupts it at that stage (its intervention point). A forecast finds the
# script an incident is following, how far along it is, and re-scores the stages still ahead with the real scorer.
scripts:
  theft:
    name: "Theft of an unattended bag"
    stages:
      - {id: left,    label: "Bag left unattended",       types: [abandoned_object],                          action: secure_object}
      - {id: taken,   label: "Someone else takes it",     types: [custody_change],                            action: track_subject}
      - {id: leaving, label: "The taker leaves",          types: [running, door_surge],                       action: dispatch_guard}
  assault:
    name: "Assault"
    stages:
      - {id: tension, label: "People gathering, tension", types: [device_crowding, occupancy_anomaly, loitering], action: crowd_control}
      - {id: fight,   label: "Fight breaks out",          types: [violence],                                  action: intervene}
      - {id: armed,   label: "A weapon is involved",      types: [weapon_visible],                            action: armed_response}
      - {id: injury,  label: "Someone is on the ground",  types: [person_down],                               action: medical}
  dealing:
    name: "Street dealing"
    stages:
      - {id: exchange, label: "Hand-to-hand exchange",    types: [hand_off],                                  action: observe_exchange}
      - {id: pattern,  label: "Repeated with different people", types: [dealing_pattern],                    action: observe_exchange}
      - {id: leaving,  label: "The dealer moves on",      types: [running],                                   action: track_subject}
  crowd:
    name: "Crowd building up"
    stages:
      - {id: gathering, label: "Crowd gathering",         types: [device_crowding, occupancy_anomaly],        action: crowd_control}
      - {id: surge,     label: "Surge at the doors",      types: [door_surge, running],                       action: crowd_control}
      - {id: exodus,    label: "People leaving in a rush", types: [device_exodus, device_dispersal],          action: dispatch_guard}

# What a signal usually looks like when it fires, taken from the rules' emit() calls (vision/rules.py,
# vision/threats.py, ingest/doors.py, ingest/gps.py). A forecast prefers the median of what it has actually seen
# today (when it has seen at least 3) and falls back to these.
typical:
  abandoned_object:    {severity: 0.8,  confidence: 0.65}
  custody_change:      {severity: 0.6,  confidence: 0.8}
  running:             {severity: 0.35, confidence: 0.5}
  loitering:           {severity: 0.3,  confidence: 0.6}
  vehicle_in_ped_zone: {severity: 0.45, confidence: 0.6}
  weapon_visible:      {severity: 0.95, confidence: 0.55}
  violence:            {severity: 0.88, confidence: 0.7}
  person_down:         {severity: 0.75, confidence: 0.8}
  hand_off:            {severity: 0.3,  confidence: 0.6}
  dealing_pattern:     {severity: 0.6,  confidence: 0.55}
  door_surge:          {severity: 0.3,  confidence: 0.7}
  device_crowding:     {severity: 0.35, confidence: 0.6}
  device_exodus:       {severity: 0.35, confidence: 0.6}
  device_dispersal:    {severity: 0.3,  confidence: 0.6}
  occupancy_anomaly:   {severity: 0.35, confidence: 0.6}

# Who carries out each action, how disruptive it is (0 none .. 3 closes an area or brings in police), and which
# operator decision it records (ack / escalate). Response times come from site.yaml `response`.
action_meta:
  monitor:          {responder: camera,  disruption: 0, records: ack}
  review_footage:   {responder: camera,  disruption: 0, records: ack}
  track_subject:    {responder: camera,  disruption: 0, records: ack}
  observe_exchange: {responder: guard,   disruption: 1, records: ack}
  check_camera:     {responder: guard,   disruption: 1, records: ack}
  dispatch_guard:   {responder: guard,   disruption: 1, records: ack}
  medical:          {responder: medical, disruption: 1, records: escalate}
  secure_object:    {responder: guard,   disruption: 2, records: ack}
  crowd_control:    {responder: staff,   disruption: 2, records: ack}
  intervene:        {responder: guard,   disruption: 2, records: escalate}
  notify_police:    {responder: police,  disruption: 3, records: escalate}
  armed_response:   {responder: police,  disruption: 3, records: escalate}

# ---- Pattern links and near-repeat watch (argus/patterns.py) ----------------------------------------------------
# Incidents that follow the same offender script and share its act (link_stages) inside the window are linked; walking
# time between the areas says whether one person could have done both. Linked incidents form a series. Only camera-seen behaviour counts (phone counts never make a series). Crowd build-up is
# not an offender script, so it never links. After an offender-script incident the site is on near-repeat watch
# for `window_s`: areas ranked by criticality x exp(-walk / watch_decay_walk_s) x time left in the window.
patterns:
  scripts: [theft, assault, dealing]
  link_stages: {theft: [taken, leaving], assault: [fight, armed, injury], dealing: [exchange, pattern]}
  window_s: 1800             # near-repeat window: 30 min
  walk_slack_s: 30           # a link may be up to this much faster than a brisk walk
  watch_decay_walk_s: 180    # nearness halves roughly every 2 min on foot
  nouns: {theft: "bag thefts", assault: "assaults", dealing: "exchange spots"}

# What each kind of behaviour needs to be seen at all (argus/coverage.py): an area with none of these streams is
# blind to it.
visibility:
  - {id: bags,     label: "Bags left or taken",        needs: [cctv]}
  - {id: violence, label: "Weapons, fights, falls",    needs: [cctv]}
  - {id: crowds,   label: "Crowds and people leaving", needs: [device, cctv]}
  - {id: doors,    label: "Door traffic",              needs: [door]}
