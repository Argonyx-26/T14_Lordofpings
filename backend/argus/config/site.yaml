# MEVA Known Facility (Muscatatuck Urban Training Center), demo window 2018-03-15 14:50–15:20 local.
site_name: "MUTC facility (MEVA)"
utc_offset_hours: -4          # clip filenames are local time (EDT on 2018-03-15)
fps: 30

areas:                         # coarse areas used for fusion; GPS polygons live in areas.geojson
  school:      {name: "School building",      criticality: 0.7}
  plaza:       {name: "School plaza & road",  criticality: 0.5}
  bus_station: {name: "Bus station",          criticality: 0.8}
  parking:     {name: "Parking areas",        criticality: 0.4}

cameras:                       # camera -> zone (fine) -> area (coarse); pos = [lat, lon] for the site map
  # Exterior positions (G336, G638) come from MEVA KRTD calibrations; indoor ones are placed inside their building.
  G421: {zone: school_cafe,  area: school,      label: "School cafe",            pos: [39.05060, -85.52880]}
  G419: {zone: school_doors, area: school,      label: "School doors A",         pos: [39.05052, -85.52850]}
  G420: {zone: school_doors, area: school,      label: "School doors B",         pos: [39.05062, -85.52832]}
  G638: {zone: plaza,        area: plaza,       label: "Plaza",                  pos: [39.050537, -85.529133]}
  G336: {zone: school_road,  area: plaza,       label: "School exterior / road", pos: [39.050541, -85.529185]}
  G474: {zone: school_road,  area: plaza,       label: "School exterior (IR)",   pos: [39.050541, -85.529185]}
  G331: {zone: bus_platform, area: bus_station, label: "Bus station",            pos: [39.049010, -85.529500]}

fusion:
  window_s: 120                # signals in the same area within this window join one incident
  context_max_severity: 0.2    # below this an event is routine context, never a signal
  siloed_alert_severity: 0.25  # what a per-stream threshold system would alert on (baseline)
  watch_threshold: 35
  open_threshold: 55
  corroboration_factors: [1.0, 1.25, 1.45]   # 1, 2, 3+ independent sources
  burst: {window_s: 30, min_count: 6, damping: 0.6}
  dismiss_penalty: 0.7         # multiplier on (area, type) after an operator dismissal
  night: {start_hour: 20, end_hour: 6, factor: 1.3}

rates:                         # rolling-baseline anomaly detection on event rates
  bucket_s: 60
  min_history: 5
  z_threshold: 2.0

# Demo navigation. Staged MEVA scenarios, positioned 45 s before they start.
bookmarks:
  - {label: "Start of window",               t_local: "2018-03-15 14:50:00"}
  - {label: "School cafe (staged scenario)", t_local: "2018-03-15 14:52:50"}
  - {label: "Bus station (staged scenario)", t_local: "2018-03-15 14:56:10"}
  - {label: "Bus station (staged scenario)", t_local: "2018-03-15 15:12:45"}
  - {label: "Bus station (staged scenario)", t_local: "2018-03-15 15:17:20"}
