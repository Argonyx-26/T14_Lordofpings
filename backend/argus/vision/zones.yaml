# Vision-only pixel polygons, ORIGINAL 1920x1072 coordinates. zone/area/label come from
# config/site.yaml. Rules test a track's FOOT point (bottom-centre of its box), so polygons are
# drawn on the floor. Check visually with: python scripts/draw_zones.py
