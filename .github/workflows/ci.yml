name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      # OpenCV comes with ultralytics on the demo laptop; CI installs the headless build for the tests that need it
      - run: pip install -r backend/requirements.txt opencv-python-headless
      # MEVA video, annotations and GPS are not in git; tests that need them skip themselves
      - run: python -m pytest -q
        working-directory: backend
        env:
          ARGUS_LLM: "off"

  frontend:
    name: frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test
      - run: npx vite build
